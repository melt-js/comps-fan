<!doctype html>
<!-- hel-standalone：独立调试页的作用域标记，避免远程产物把页面级样式注入宿主 -->
<html lang="zh-CN" class="hel-standalone">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comps-fan</title>
    <!--
      vue 被 external 成 window.Vue，独立访问本页时由这里的 CDN 提供运行时；
      data-helappend="0"：宿主通过 hel 解析本页时跳过该脚本，
      使用宿主 bindVueRuntime 注入的那一份 vue，避免双 vue 导致响应式失效。
    -->
    <script
      data-helappend="0"
      src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js"
    ></script>
    <script type="module" crossorigin src="/comps-fan/hel_dist/assets/index-IseiIRiJ.js"></script>
    <link rel="modulepreload" crossorigin href="/comps-fan/hel_dist/assets/shared-runtime-hsFVeZ6W.js">
    <link rel="modulepreload" crossorigin href="/comps-fan/hel_dist/assets/vendor-Bu9odYRA.js">
    <link rel="modulepreload" crossorigin href="/comps-fan/hel_dist/assets/_virtual_comps-fan-uno-C6tbDbII.js">
    <link rel="stylesheet" crossorigin href="/comps-fan/hel_dist/assets/style-BhoKQhKm.css">
  </head>
  <body>
    <div id="app" data-comps-fan-standalone></div>
  </body>
</html>
